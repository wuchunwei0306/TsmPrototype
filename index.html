<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS PRD · 产品需求文档</title>
<!-- marked.js for MD→HTML rendering -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root {
  --bg:      #0d1117;
  --bg2:     #161b22;
  --bg3:     #1c2128;
  --border:  #30363d;
  --text:    #e6edf3;
  --text2:   #8b949e;
  --text3:   #6e7681;
  --blue:    #58a6ff;
  --green:   #3fb950;
  --orange:  #d29922;
  --red:     #f85149;
  --purple:  #a371f7;
  --sidebar: 240px;
  --topbar:  100px;
  --preview: 340px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.7}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── TOP BAR ── */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar);background:var(--bg2);border-bottom:1px solid var(--border);z-index:300;display:flex;flex-direction:column}
.topbar-row1{display:flex;align-items:center;padding:0 16px;gap:12px;height:52px;flex-shrink:0;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#58a6ff,#3fb950);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.brand-name{font-size:14px;font-weight:700;color:var(--text)}
.brand-sub{font-size:11px;color:var(--text3);margin-left:4px}
.divider{width:1px;height:28px;background:var(--border);flex-shrink:0}

/* Search */
.search-wrap{flex:1;max-width:480px;position:relative}
.search-input{width:100%;padding:7px 32px 7px 34px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--blue)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text3);pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px;display:none}
.search-clear.show{display:block}
.search-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);max-height:420px;overflow-y:auto;z-index:999;display:none}
.search-dropdown.show{display:block}
.sri{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.sri:last-child{border-bottom:none}
.sri:hover,.sri.sel{background:var(--bg3)}
.sri-tag{display:inline-block;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.25);color:var(--blue);padding:1px 6px;border-radius:3px;font-size:10px;margin-bottom:3px}
.sri-title{font-size:13px;color:var(--text);font-weight:500;margin-bottom:3px}
.sri-snippet{font-size:12px;color:var(--text3);line-height:1.5}
.sri-snippet mark,.sri-title mark{background:rgba(88,166,255,.25);color:var(--blue);border-radius:2px;padding:0 2px}
.search-empty{padding:28px;text-align:center;color:var(--text3);font-size:13px}
.search-loading{padding:20px;text-align:center;color:var(--text3);font-size:12px}

/* Actions */
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.btn-proto{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:6px;background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);color:var(--blue);font-size:12px;font-weight:500;text-decoration:none;transition:all .15s;white-space:nowrap}
.btn-proto:hover{background:rgba(88,166,255,.2);border-color:var(--blue)}
.btn-preview{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s}
.btn-preview:hover{border-color:var(--purple);color:var(--text)}
.btn-preview.on{background:rgba(163,113,247,.1);border-color:rgba(163,113,247,.35);color:var(--purple)}

/* Row 2 tabs */
.topbar-row2{display:flex;align-items:stretch;padding:0 12px;height:48px;flex-shrink:0;overflow-x:auto;gap:0}
.topbar-row2::-webkit-scrollbar{height:0}
.tab-group{display:flex;align-items:center;padding:0 4px;border-right:1px solid var(--border);gap:2px}
.tab-group:last-child{border-right:none}
.tab-group-label{font-size:10px;font-weight:600;letter-spacing:.7px;color:var(--text3);text-transform:uppercase;padding:0 6px;white-space:nowrap;flex-shrink:0}
.mod-tab{padding:5px 12px;border:none;border-radius:5px;background:transparent;color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.mod-tab:hover{background:var(--bg3);color:var(--text)}
.mod-tab.active{background:rgba(88,166,255,.15);color:var(--blue);font-weight:500}

/* ── LAYOUT ── */
.layout{display:flex;height:calc(100vh - var(--topbar));margin-top:var(--topbar)}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-hd{padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;flex-shrink:0}
.sidebar-body{flex:1;overflow-y:auto;padding:6px 0}
.ch{border-bottom:1px solid rgba(48,54,61,.5)}
.ch-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:var(--text2);transition:all .15s}
.ch-hd:hover{background:var(--bg3);color:var(--text)}
.ch-caret{font-size:9px;transition:transform .2s;color:var(--text3)}
.ch.collapsed .ch-caret{transform:rotate(-90deg)}
.ch.collapsed .ch-items{display:none}
.nav-a{display:block;padding:5px 14px 5px 20px;font-size:12px;color:var(--text3);cursor:pointer;transition:all .12s;border-left:2px solid transparent;margin-left:2px}
.nav-a:hover{color:var(--text2);background:rgba(255,255,255,.02)}
.nav-a.active{color:var(--blue);border-left-color:var(--blue);background:rgba(88,166,255,.05)}
.nav-a.h3{padding-left:30px;font-size:11px}

/* ── CONTENT ── */
.content{flex:1;min-width:0;overflow-y:auto;padding:32px 44px 80px}

/* ── Markdown ── */
.md h1{font-size:22px;font-weight:700;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--border);color:var(--text)}
.md h2{font-size:16px;font-weight:600;margin:32px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);color:var(--text);scroll-margin-top:24px}
.md h3{font-size:14px;font-weight:600;margin:20px 0 8px;color:var(--text2);scroll-margin-top:24px}
.md p{margin-bottom:12px;color:var(--text2);line-height:1.8}
.md ul,.md ol{margin:6px 0 12px 20px;color:var(--text2)}
.md li{margin-bottom:4px;line-height:1.75}
.md strong{color:var(--text);font-weight:600}
.md code{background:var(--bg3);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--blue)}
.md pre{background:var(--bg3);border:1px solid var(--border);padding:14px 16px;border-radius:8px;overflow-x:auto;margin:12px 0}
.md pre code{background:none;border:none;padding:0;color:var(--text2);font-size:12px;line-height:1.6}
.md table{width:100%;border-collapse:collapse;margin:12px 0 20px;font-size:13px}
.md th{background:var(--bg3);padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
.md td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top}
.md tr:hover td{background:rgba(255,255,255,.015)}
.md blockquote{border-left:3px solid var(--orange);padding:10px 16px;background:rgba(210,153,34,.06);border-radius:0 6px 6px 0;margin:12px 0;color:var(--text2);font-size:13px}
.md hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.md a{color:var(--blue);text-decoration:none}
.md a:hover{text-decoration:underline}

/* screenshot button */
.ss-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;cursor:pointer;background:rgba(163,113,247,.1);border:1px solid rgba(163,113,247,.3);color:var(--purple);font-size:11px;font-weight:500;transition:all .15s;vertical-align:middle;margin-left:6px}
.ss-btn:hover{background:rgba(163,113,247,.2);border-color:var(--purple)}

/* loading / error states */
.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;height:55vh;gap:14px;color:var(--text3)}
.state-ico{font-size:44px;opacity:.25}
.state-spin{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── PREVIEW ── */
.preview{width:var(--preview);flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease,opacity .25s}
.preview.hidden{width:0;opacity:0;pointer-events:none}
.preview-hd{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.preview-hd-title{font-size:11px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px}
.preview-dot{width:7px;height:7px;border-radius:50%;background:var(--purple)}
.preview-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:2px 5px;border-radius:3px;transition:all .12s}
.preview-close:hover{background:var(--bg3);color:var(--text)}
.preview-body{flex:1;overflow-y:auto;padding:12px}
.preview-tip{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.2);border-radius:7px;padding:14px;margin-bottom:14px;font-size:12px;color:var(--text2);line-height:1.7}
.preview-tip h4{color:var(--blue);font-size:12px;margin-bottom:8px}
.preview-tip code{font-size:11px;background:var(--bg3);padding:2px 5px;border-radius:3px;color:var(--purple)}
.preview-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:160px;color:var(--text3);font-size:12px;text-align:center;gap:10px;padding:24px 16px}
.preview-placeholder-ico{font-size:36px;opacity:.35}
.preview-img-card{border-radius:7px;overflow:hidden;border:1px solid var(--border);background:var(--bg3);margin-bottom:10px}
.preview-img-card img{width:100%;display:block}
.preview-img-lbl{padding:7px 10px;font-size:11px;color:var(--text3);border-top:1px solid var(--border)}
.preview-missing{background:var(--bg3);border:1px dashed var(--border);border-radius:6px;padding:20px;text-align:center;color:var(--text3);font-size:12px}
.preview-missing code{display:block;margin-top:6px;color:var(--purple);font-size:11px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row1">
    <div class="brand">
      <div class="brand-icon">T</div>
      <span class="brand-name">TMS</span>
      <span class="brand-sub">产品需求文档</span>
    </div>
    <div class="divider"></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text"
        placeholder="搜索文档内容… (支持模糊搜索)"
        oninput="onSearch(this.value)"
        onkeydown="onSearchKey(event)"
        autocomplete="off">
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
    <div class="topbar-actions">
      <a class="btn-proto" href="https://prototype20260603.netlify.app/trading-detail" target="_blank">🔗 查看原型</a>
      <button class="btn-preview on" id="previewBtn" onclick="togglePreview()">🖼 截图面板</button>
    </div>
  </div>
  <div class="topbar-row2">
    <div class="tab-group">
      <span class="tab-group-label">联赛管理</span>
      <button class="mod-tab" data-doc="league" onclick="switchDoc('league')">联赛管理</button>
    </div>
    <div class="tab-group">
      <span class="tab-group-label">操盘管理</span>
      <button class="mod-tab" data-doc="trading-list" onclick="switchDoc('trading-list')">操盘列表</button>
      <button class="mod-tab" data-doc="trading-detail" onclick="switchDoc('trading-detail')">操盘详情</button>
    </div>
    <div class="tab-group">
      <span class="tab-group-label">风控管理</span>
      <button class="mod-tab" data-doc="risk-config" onclick="switchDoc('risk-config')">风控配置</button>
      <button class="mod-tab" data-doc="risk-log" onclick="switchDoc('risk-log')">风控日志</button>
    </div>
    <div class="tab-group">
      <span class="tab-group-label">结算管理</span>
      <button class="mod-tab" data-doc="settlement-list" onclick="switchDoc('settlement-list')">结算列表</button>
      <button class="mod-tab" data-doc="settlement-detail" onclick="switchDoc('settlement-detail')">结算详情</button>
      <button class="mod-tab" data-doc="settlement-report" onclick="switchDoc('settlement-report')">结算报表</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-hd" id="sidebarHd">目录</div>
    <div class="sidebar-body" id="sidebarBody">
      <div style="padding:40px 16px;text-align:center;color:var(--text3);font-size:12px">从顶部选择模块</div>
    </div>
  </aside>

  <main class="content" id="content">
    <div class="md" id="mdBody">
      <div class="state-box">
        <div class="state-ico">📋</div>
        <div style="font-size:14px">从顶部导航选择模块开始阅读</div>
        <div style="font-size:12px;opacity:.7">或使用搜索框快速定位内容</div>
      </div>
    </div>
  </main>

  <aside class="preview" id="previewPanel">
    <div class="preview-hd">
      <div class="preview-hd-title"><span class="preview-dot"></span>截图预览</div>
      <button class="preview-close" onclick="clearPreview()" title="清空">✕</button>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-tip">
        <h4>📌 如何添加截图按钮</h4>
        在 <code>.md</code> 文档中写：<br><br>
        <code>[查看截图](screenshots/文件名.png)</code><br><br>
        系统自动转为紫色按钮，点击后截图显示在此处。截图文件放仓库 <code>screenshots/</code> 目录下。
      </div>
      <div class="preview-placeholder">
        <div class="preview-placeholder-ico">🖼</div>
        <div>点击文档中的<br><strong style="color:var(--purple)">「查看截图」</strong>按钮<br>在此处展示对应截图</div>
      </div>
    </div>
  </aside>
</div>

<script>
// ══════════════════════════════════════════════
// DOC REGISTRY  — 维护时只需修改这里的路径
// ══════════════════════════════════════════════
const DOC_REGISTRY = {
  'league':             { title: '联赛管理',   file: 'docs/聯賽管理/联赛管理.md' },
  'trading-list':       { title: '操盘列表',   file: 'docs/操盤管理/操盘列表.md' },
  'trading-detail':     { title: '操盘详情',   file: 'docs/操盤管理/操盘详情.md' },
  'risk-config':        { title: '风控配置',   file: 'docs/風控管理/风控配置.md' },
  'risk-log':           { title: '风控日志',   file: 'docs/風控管理/风控日志.md' },
  'settlement-list':    { title: '结算列表',   file: 'docs/結算管理/结算列表.md' },
  'settlement-detail':  { title: '结算详情',   file: 'docs/結算管理/结算详情.md' },
  'settlement-report':  { title: '结算报表',   file: 'docs/結算管理/结算报表.md' },
};

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
const cache = {};          // key → { html, plainText, headings }
let currentDoc  = null;
let previewOn   = true;
let searchTimer = null;
let selIdx      = -1;

// marked config — custom renderer injects id on every heading
const renderer = new marked.Renderer();
renderer.heading = function(token) {
  const text = typeof token === 'object' ? (token.text || '') : (String(token) || '');
  const level = typeof token === 'object' ? (token.depth || 2) : (arguments[1] || 2);
  const slug = text
    .replace(/<[^>]+>/g, '')
    .replace(/[^\u4e00-\u9fa5\w\s\-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .toLowerCase() || ('h' + level + '-' + Math.random().toString(36).slice(2,6));
  return '<h' + level + ' id="' + slug + '">' + text + '</h' + level + '>\n';
};
marked.setOptions({ breaks: true, gfm: true, renderer: renderer });

// ══════════════════════════════════════════════
// SWITCH DOC
// ══════════════════════════════════════════════
async function switchDoc(key, anchorId) {
  currentDoc = key;
  document.querySelectorAll('.mod-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.doc === key)
  );

  if (cache[key]) {
    renderDoc(key, anchorId);
    return;
  }

  // Show loading
  document.getElementById('mdBody').innerHTML =
    '<div class="state-box"><div class="state-spin"></div><div style="font-size:12px;margin-top:8px">加载中…</div></div>';
  document.getElementById('sidebarBody').innerHTML =
    '<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">加载中…</div>';

  const reg = DOC_REGISTRY[key];
  if (!reg) {
    showError(key, '未找到文档配置');
    return;
  }

  try {
    const res = await fetch(reg.file);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    const html = marked.parse(md);
    const headings = extractHeadings(html);
    const plain = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    cache[key] = { html, headings, plain };
    renderDoc(key, anchorId);
  } catch(e) {
    showError(key, e.message);
  }
}

function showError(key, msg) {
  const reg = DOC_REGISTRY[key] || {};
  document.getElementById('mdBody').innerHTML = `
    <div class="state-box">
      <div class="state-ico">⚠️</div>
      <div style="font-size:14px;color:var(--red)">文档加载失败</div>
      <div style="font-size:12px">${reg.file || key}</div>
      <div style="font-size:11px;color:var(--text3)">${msg}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.8;text-align:center">
        请确认文件已放入 <code style="color:var(--purple)">docs/</code> 目录<br>
        本地直接打开 HTML 文件会因浏览器安全策略无法读取 .md<br>
        建议使用 GitHub Pages 或本地 HTTP 服务器访问
      </div>
    </div>`;
  document.getElementById('sidebarBody').innerHTML = '';
}

function renderDoc(key, anchorId) {
  const d = cache[key];
  document.getElementById('mdBody').className = 'md';
  document.getElementById('mdBody').innerHTML = d.html;
  injectSsBtns();
  buildSidebar(key);
  clearPreviewBody();
  if (anchorId) {
    setTimeout(() => scrollToId(anchorId), 60);
  } else {
    document.getElementById('content').scrollTo(0, 0);
  }
}

// ══════════════════════════════════════════════
// HEADINGS extraction
// ══════════════════════════════════════════════
function extractHeadings(html) {
  // Match h2/h3 with or without id attribute
  const re = /<h([23])([^>]*)>(.*?)<\/h\1>/g;
  const result = [];
  let m;
  while ((m = re.exec(html)) !== null) {
    const attrs = m[2];
    const text = m[3].replace(/<[^>]+>/g, '');
    // Extract id if present, otherwise generate from text
    const idMatch = attrs.match(/id="([^"]*)"/);
    const id = idMatch ? idMatch[1] : text
      .replace(/[^\u4e00-\u9fa5\w\s\-]/g, '')
      .trim()
      .replace(/\s+/g, '-')
      .toLowerCase() || ('h' + m[1] + '-' + Math.random().toString(36).slice(2,6));
    result.push({ level: m[1], id, text });
  }
  return result;
}

// ══════════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════════
function buildSidebar(key) {
  const d = cache[key];
  const reg = DOC_REGISTRY[key];
  document.getElementById('sidebarHd').textContent = (reg ? reg.title : key) + ' · 目录';
  const body = document.getElementById('sidebarBody');
  body.innerHTML = '';

  let chapter = null, items = null;
  d.headings.forEach(h => {
    if (h.level === '2') {
      chapter = document.createElement('div');
      chapter.className = 'ch';
      const hd = document.createElement('div');
      hd.className = 'ch-hd';
      hd.innerHTML = `<span>${h.text}</span><span class="ch-caret">▾</span>`;
      hd.onclick = () => chapter.classList.toggle('collapsed');
      items = document.createElement('div');
      items.className = 'ch-items';
      items.appendChild(makeLink(h.text, h.id, false));
      chapter.appendChild(hd);
      chapter.appendChild(items);
      body.appendChild(chapter);
    } else if (h.level === '3' && items) {
      items.appendChild(makeLink(h.text, h.id, true));
    }
  });
}

function makeLink(text, id, isH3) {
  const a = document.createElement('a');
  a.className = 'nav-a' + (isH3 ? ' h3' : '');
  a.textContent = text;
  a._id = id;
  a.onclick = () => {
    scrollToId(id);
    document.querySelectorAll('.nav-a').forEach(n => n.classList.remove('active'));
    a.classList.add('active');
  };
  return a;
}

function scrollToId(id) {
  const el = document.getElementById(id);
  if (!el) return;
  document.getElementById('content').scrollTo({ top: el.offsetTop - 20, behavior: 'smooth' });
}

// Scroll spy
document.getElementById('content').addEventListener('scroll', function() {
  if (!currentDoc) return;
  const hs = document.getElementById('mdBody').querySelectorAll('h2[id],h3[id]');
  const top = this.scrollTop + 70;
  let cur = null;
  hs.forEach(h => { if (h.offsetTop <= top) cur = h; });
  if (!cur) return;
  document.querySelectorAll('.nav-a').forEach(n =>
    n.classList.toggle('active', n._id === cur.id)
  );
});

// ══════════════════════════════════════════════
// SCREENSHOT BUTTONS
// ══════════════════════════════════════════════
function injectSsBtns() {
  const body = document.getElementById('mdBody');
  body.innerHTML = body.innerHTML.replace(
    /<a href="(screenshots\/[^"]+)"[^>]*>([^<]*)<\/a>/g,
    (_, src, label) =>
      `<button class="ss-btn" onclick="showPreview('${src}','${label}')">${label}</button>`
  );
}

// ══════════════════════════════════════════════
// PREVIEW
// ══════════════════════════════════════════════
function showPreview(src, label) {
  if (!previewOn) togglePreview();
  document.getElementById('previewBody').innerHTML = `
    <div class="preview-img-card">
      <img src="${src}" alt="${label}"
        onerror="this.parentElement.outerHTML='<div class=preview-missing>截图未找到<code>${src}</code></div>'">
      <div class="preview-img-lbl">${label}</div>
    </div>`;
}

function clearPreview() { clearPreviewBody(); }

function clearPreviewBody() {
  document.getElementById('previewBody').innerHTML = `
    <div class="preview-tip">
      <h4>📌 如何添加截图按钮</h4>
      在 <code>.md</code> 文档中写：<br><br>
      <code>[查看截图](screenshots/文件名.png)</code><br><br>
      系统自动转为紫色按钮，点击后截图显示在此处。截图文件放仓库 <code>screenshots/</code> 目录下。
    </div>
    <div class="preview-placeholder">
      <div class="preview-placeholder-ico">🖼</div>
      <div>点击文档中的<br><strong style="color:var(--purple)">「查看截图」</strong>按钮<br>在此处展示对应截图</div>
    </div>`;
}

function togglePreview() {
  previewOn = !previewOn;
  document.getElementById('previewPanel').classList.toggle('hidden', !previewOn);
  document.getElementById('previewBtn').classList.toggle('on', previewOn);
}

// ══════════════════════════════════════════════
// SEARCH  (searches all cached + pre-fetches all)
// ══════════════════════════════════════════════
// Pre-fetch all docs in background for full search
async function prefetchAll() {
  for (const key of Object.keys(DOC_REGISTRY)) {
    if (!cache[key]) {
      try {
        const reg = DOC_REGISTRY[key];
        const res = await fetch(reg.file);
        if (!res.ok) continue;
        const md = await res.text();
        const html = marked.parse(md);
        const headings = extractHeadings(html);
        const plain = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
        cache[key] = { html, headings, plain };
      } catch(e) { /* skip */ }
    }
  }
}
// Start prefetch after page load (non-blocking)
window.addEventListener('load', () => setTimeout(prefetchAll, 800));

function onSearch(val) {
  clearTimeout(searchTimer);
  document.getElementById('searchClear').classList.toggle('show', val.length > 0);
  if (!val.trim()) { closeSearch(); return; }
  searchTimer = setTimeout(() => doSearch(val.trim()), 180);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  closeSearch();
}

function closeSearch() {
  const dd = document.getElementById('searchDropdown');
  dd.classList.remove('show');
  dd.innerHTML = '';
  selIdx = -1;
}

function onSearchKey(e) {
  const dd = document.getElementById('searchDropdown');
  const items = dd.querySelectorAll('.sri');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    selIdx = Math.min(selIdx + 1, items.length - 1);
    items.forEach((it, i) => it.classList.toggle('sel', i === selIdx));
    if (items[selIdx]) items[selIdx].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selIdx = Math.max(selIdx - 1, 0);
    items.forEach((it, i) => it.classList.toggle('sel', i === selIdx));
  } else if (e.key === 'Enter') {
    const target = items[selIdx] || items[0];
    if (target) target.click();
  } else if (e.key === 'Escape') {
    clearSearch();
  }
}

function doSearch(q) {
  const dd = document.getElementById('searchDropdown');
  const cachedKeys = Object.keys(cache);

  if (cachedKeys.length === 0) {
    dd.innerHTML = '<div class="search-loading">文档加载中，请稍后搜索…</div>';
    dd.classList.add('show');
    return;
  }

  const qLower = q.toLowerCase();
  // fuzzy: chars must appear in order
  const fuzzyRe = new RegExp(
    q.split('').map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*'), 'i'
  );

  const results = [];

  cachedKeys.forEach(docKey => {
    const d = cache[docKey];
    const reg = DOC_REGISTRY[docKey];
    const docTitle = reg ? reg.title : docKey;

    // heading hits
    d.headings.forEach(h => {
      if (fuzzyRe.test(h.text)) {
        const exact = h.text.toLowerCase().includes(qLower);
        results.push({
          docKey, docTitle, headingId: h.id,
          title: h.text,
          snippet: extractSnippet(d.plain, q),
          score: exact ? 3 : 1
        });
      }
    });

    // full text hit
    const idx = d.plain.toLowerCase().indexOf(qLower);
    if (idx !== -1) {
      results.push({
        docKey, docTitle, headingId: null,
        title: docTitle + ' · 全文',
        snippet: extractSnippet(d.plain, q, idx),
        score: 0
      });
    }
  });

  results.sort((a, b) => b.score - a.score);

  // dedup: max 3 heading results per doc
  const seen = {};
  const filtered = results.filter(r => {
    const k = r.docKey + (r.headingId ? '_h' : '_t');
    seen[k] = (seen[k] || 0) + 1;
    return seen[k] <= 3;
  }).slice(0, 14);

  if (filtered.length === 0) {
    const notCached = Object.keys(DOC_REGISTRY).length - cachedKeys.length;
    dd.innerHTML = `<div class="search-empty">没有找到「${q}」相关内容${notCached > 0 ? `<br><span style="font-size:11px">还有 ${notCached} 个文档正在后台加载，稍后再试</span>` : ''}</div>`;
    dd.classList.add('show');
    return;
  }

  dd.innerHTML = filtered.map((r, i) => `
    <div class="sri" data-i="${i}" onclick="goResult('${r.docKey}','${r.headingId || ''}')">
      <div><span class="sri-tag">${r.docTitle}</span></div>
      <div class="sri-title">${hl(r.title, q)}</div>
      <div class="sri-snippet">${r.snippet}</div>
    </div>`).join('');
  dd.classList.add('show');
  selIdx = -1;
}

function goResult(docKey, anchorId) {
  clearSearch();
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  switchDoc(docKey, anchorId || null);
}

function extractSnippet(plain, q, forceIdx) {
  const idx = forceIdx !== undefined ? forceIdx : plain.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return hl(plain.slice(0, 80) + '…', q);
  const s = Math.max(0, idx - 30);
  const e = Math.min(plain.length, idx + q.length + 60);
  return (s > 0 ? '…' : '') + hl(plain.slice(s, e), q) + (e < plain.length ? '…' : '');
}

function hl(text, q) {
  if (!q) return text;
  try {
    return text.replace(
      new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'),
      '<mark>$1</mark>'
    );
  } catch(e) { return text; }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) closeSearch();
});
</script>
